[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Convert scanned PDFs to Markdown with PP-OCRv6_small (RapidOCR, ONNX Runtime)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "AlexRaganhar", email = "cwycwy0526@hotmail.com" },
]
keywords = ["pdf", "ocr", "markdown", "rapidocr", "pp-ocrv6"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.17",
  "pypdfium2>=5",
  "pypdf>=5",
  "pillow>=9",
]

[project.urls]
Homepage = "https://github.com/AlexRaganhar/pdf2md"
Repository = "https://github.com/AlexRaganhar/pdf2md"
Issues = "https://github.com/AlexRaganhar/pdf2md/issues"

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.setuptools]
packages = ["pdf2md"]