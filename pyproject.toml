[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf2md"
version = "0.1.0"
description = "Convert scanned PDFs to Markdown using PP-OCRv6_small + Docling."
readme = "README.md"
requires-python = ">=3.9,<3.13"
license = { text = "MIT" }
authors = [
  { name = "AlexRaganhar", email = "cwycwy0526@hotmail.com" },
]
keywords = ["pdf", "ocr", "markdown", "paddleocr", "docling"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
  "docling>=2.0.0",
  "paddleocr",
  "pypdfium2",
  "pypdf",
]

[project.scripts]
pdf2md = "pdf2md.cli:main"

[tool.setuptools]
packages = ["pdf2md"]